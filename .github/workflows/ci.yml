name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The advisory database changes daily even when the code does not. Without
  # this, a new RUSTSEC advisory against a locked dependency stays invisible
  # until someone happens to push — RUSTSEC-2026-0285 was only caught because
  # an unrelated docs PR ran the audit five days after it was published.
  # Only audit-check runs on the schedule; every other job is gated off it.
  # Failure notifications for scheduled runs go to whoever last edited this
  # cron line. GitHub disables scheduled workflows after 60 days without
  # repository activity; re-enable from the Actions tab if that happens.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-check:
    name: audit-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The audit tool is independent of the project's MSRV toolchain.
      - name: Install Rust toolchain for audit
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # Fetch the current RustSec database; do not filter out other platforms.
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock --deny warnings

  release-hardening:
    name: Release workflow hardening
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # release.yml is cargo-dist-generated, so `dist generate` silently
      # reverts its manual hardening. Catch that here rather than at the next
      # release, when the workflow still works — just unpinned.
      - name: Check release workflow hardening
        run: sh scripts/check-release-hardening.sh

      # Same SHA-pin rule for this file: CI jobs run on every PR, so a moved
      # tag here executes in the same repository context as release.yml.
      - name: Check CI workflow pinning
        run: sh scripts/check-release-hardening.sh .github/workflows/ci.yml

      - name: Check installer hardening
        run: sh scripts/test-install.sh

  fmt:
    name: Rust formatting
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: "1.91"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: "1.91"
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: "1.91"

      - name: Run tests
        run: cargo test
