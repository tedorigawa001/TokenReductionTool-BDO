[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm", "homebrew"]
# The npm package name: `bushido` and `bdo` are both squatted on npm,
# so the package is `bdo-cli`. The installed command is still `bdo`
# (npm's bin name comes from the cargo [[bin]] name).
npm-package = "bdo-cli"
# Some security scanners flag any npm package that ships an
# npm-shrinkwrap.json as a supply-chain risk heuristic (it can pin
# dependency versions the top-level package.json doesn't show). Our
# lockfile matched package.json exactly and posed no real risk, but the
# installer only needs `detect-libc`/`prettier`'s existing semver ranges —
# skip generating the lockfile rather than keep re-justifying the warning.
npm-shrinkwrap = false
# release.yml is hand-hardened after generation: every action is pinned to a
# commit SHA and both pipe-to-shell installs are gone. dist refuses to release
# while the file differs from its template ("out of date contents"), so opt the
# CI file out of that check. The trade-off is that dist can no longer keep
# release.yml current on its own — after a dist upgrade, regenerate it
# deliberately and re-apply the hardening, which
# scripts/check-release-hardening.sh verifies in CI.
allow-dirty = ["ci"]
# Publish the Homebrew formula and the npm package from CI.
# Requires the repo secret HOMEBREW_TAP_TOKEN (PAT with write access to the
# tap repo). npm needs no secret: release.yml stages it via Trusted Publishing
# and a maintainer approves it (`npm stage approve`).
publish-jobs = ["homebrew", "npm"]
# The GitHub repo to push the Homebrew formula to
tap = "tedorigawa001/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Attach GitHub build provenance to each platform's archives
# (`gh attestation verify`). release.yml carries it by hand under allow-dirty.
github-attestations = true
